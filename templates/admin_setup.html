<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Setup | SecureCloud</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(37, 99, 235, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(6, 182, 212, 0.12),
                    transparent 35%
                ),
                #080d18;

            color: #e5e7eb;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;

            background: rgba(17, 24, 39, 0.92);

            border: 1px solid #1f2937;

            border-radius: 20px;

            padding: 38px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(10px);

            animation: appear 0.5s ease;
        }

        @keyframes appear {

            from {
                opacity: 0;

                transform:
                    translateY(15px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #06b6d4
                );

            box-shadow:
                0 10px 30px
                rgba(37, 99, 235, 0.25);
        }

        .logo h1 {
            color: white;
            font-size: 24px;
            margin-bottom: 6px;
        }

        .logo p {
            color: #6b7280;
            font-size: 13px;
        }

        .info {
            padding: 14px;

            margin-bottom: 22px;

            border-radius: 10px;

            background:
                rgba(
                    37,
                    99,
                    235,
                    0.08
                );

            border: 1px solid
                rgba(
                    37,
                    99,
                    235,
                    0.25
                );

            color: #93c5fd;

            font-size: 12px;

            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            color: #d1d5db;

            font-size: 13px;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border-radius: 9px;

            border: 1px solid #374151;

            background: #0f172a;

            color: white;

            outline: none;

            font-size: 13px;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.12
                );
        }

        input::placeholder {
            color: #4b5563;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.2s;

            box-shadow:
                0 8px 20px
                rgba(
                    37,
                    99,
                    235,
                    0.18
                );
        }

        button:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 12px 25px
                rgba(
                    37,
                    99,
                    235,
                    0.25
                );
        }

        button:active {
            transform:
                translateY(0);
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #38bdf8;

            text-decoration: none;

            font-size: 12px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .security {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 6px;

            margin-top: 22px;

            color: #4b5563;

            font-size: 11px;
        }

        .dot {
            width: 6px;
            height: 6px;

            background: #22c55e;

            border-radius: 50%;
        }

        @media (max-width: 500px) {

            .container {
                padding: 28px 22px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">

            <div class="logo-icon">
                🔐
            </div>

            <h1>
                Admin Setup
            </h1>

            <p>
                Configure administrator access
            </p>

        </div>

        <div class="info">

            Administrator access is protected
            by a setup code. Only use this page
            for a trusted account.

        </div>

        <form
            action="/admin-setup"
            method="POST"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your registered username"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="setup_code">
                    Admin Setup Code
                </label>

                <input
                    type="password"
                    id="setup_code"
                    name="setup_code"
                    placeholder="Enter admin setup code"
                    autocomplete="off"
                    required
                >

            </div>

            <button type="submit">
                Make Administrator
            </button>

        </form>

        <a
            href="/dashboard"
            class="back"
        >
            ← Back to Dashboard
        </a>

        <div class="security">

            <div class="dot"></div>

            Secure administrator configuration

        </div>

    </div>

</body>

</html>
