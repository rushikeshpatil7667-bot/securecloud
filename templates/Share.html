<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Share File | SecureCloud</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: "Segoe UI", Arial, sans-serif;

            color: #e5e7eb;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(37, 99, 235, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(6, 182, 212, 0.12),
                    transparent 35%
                ),
                #080d18;
        }

        .container {
            width: 100%;
            max-width: 500px;

            background: #0d1422;

            border: 1px solid #1b2638;

            border-radius: 18px;

            padding: 32px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);

            animation: appear 0.4s ease;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 14px;

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #06b6d4
                );

            box-shadow:
                0 10px 30px
                rgba(37, 99, 235, 0.25);
        }

        .logo h1 {
            color: white;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #64748b;
            font-size: 12px;
        }

        .file-box {
            display: flex;
            align-items: center;

            gap: 12px;

            padding: 14px;

            background: #101a2a;

            border: 1px solid #1e293b;

            border-radius: 11px;

            margin-bottom: 20px;
        }

        .file-icon {
            width: 40px;
            height: 40px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;

            background: #172554;

            font-size: 18px;
        }

        .file-info {
            min-width: 0;
        }

        .file-info strong {
            display: block;

            color: #e2e8f0;

            font-size: 13px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .file-info span {
            display: block;

            color: #64748b;

            font-size: 10px;

            margin-top: 4px;
        }

        .share-title {
            color: white;

            font-size: 14px;

            margin-bottom: 8px;
        }

        .share-description {
            color: #64748b;

            font-size: 11px;

            line-height: 1.6;

            margin-bottom: 14px;
        }

        .link-box {
            display: flex;

            gap: 8px;

            margin-bottom: 12px;
        }

        .link-box input {
            flex: 1;

            min-width: 0;

            padding: 11px 12px;

            background: #080d18;

            border: 1px solid #263449;

            border-radius: 8px;

            color: #60a5fa;

            font-size: 10px;

            outline: none;
        }

        .copy-btn {
            border: none;

            border-radius: 8px;

            padding: 0 15px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 11px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .copy-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(37, 99, 235, 0.25);
        }

        .security {
            display: flex;

            align-items: center;

            gap: 7px;

            padding: 10px 12px;

            border-radius: 8px;

            background: #0b1f18;

            border: 1px solid #164e3a;

            color: #4ade80;

            font-size: 10px;

            margin-bottom: 20px;
        }

        .security-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 7px
                rgba(34, 197, 94, 0.6);
        }

        .buttons {
            display: flex;

            gap: 9px;
        }

        .button {
            flex: 1;

            text-align: center;

            text-decoration: none;

            padding: 11px;

            border-radius: 8px;

            font-size: 11px;

            transition: 0.2s;
        }

        .dashboard-btn {
            color: #94a3b8;

            background: #111c2d;

            border: 1px solid #263449;
        }

        .dashboard-btn:hover {
            color: white;

            background: #162338;
        }

        .files-btn {
            color: #60a5fa;

            background: #102346;

            border: 1px solid #1e3a8a;
        }

        .files-btn:hover {
            background: #172f62;
        }

        .message {
            text-align: center;

            margin-top: 13px;

            color: #4ade80;

            font-size: 10px;

            display: none;
        }

        @media (max-width: 500px) {

            .container {
                padding: 25px 20px;
            }

            .link-box {
                flex-direction: column;
            }

            .copy-btn {
                padding: 10px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">

            <div class="logo-icon">
                🔗
            </div>

            <h1>
                Share File
            </h1>

            <p>
                SecureCloud file sharing
            </p>

        </div>

        <div class="file-box">

            <div class="file-icon">
                📄
            </div>

            <div class="file-info">

                <strong>
                    {{ file.filename }}
                </strong>

                <span>
                    🔒 Encrypted file
                </span>

            </div>

        </div>

        <div class="share-title">
            Anyone with the link
        </div>

        <div class="share-description">

            Anyone who has this link can download
            the file. Your AWS S3 storage remains
            private and protected.

        </div>

        <div class="link-box">

            <input
                type="text"
                id="shareLink"
                value="{{ share_link }}"
                readonly
            >

            <button
                type="button"
                class="copy-btn"
                onclick="copyLink()"
            >
                Copy Link
            </button>

        </div>

        <div
            class="message"
            id="copyMessage"
        >
            ✓ Link copied successfully
        </div>

        <div class="security">

            <div class="security-dot"></div>

            Secure share link generated

        </div>

        <div class="buttons">

            <a
                href="/files"
                class="button dashboard-btn"
            >
                ← My Files
            </a>

            <a
                href="/dashboard"
                class="button files-btn"
            >
                Dashboard
            </a>

        </div>

    </div>

    <script>

        function copyLink() {

            const input =
                document.getElementById(
                    "shareLink"
                );

            const message =
                document.getElementById(
                    "copyMessage"
                );

            if (
                navigator.clipboard &&
                window.isSecureContext
            ) {

                navigator.clipboard.writeText(
                    input.value
                ).then(function () {

                    showMessage();

                });

                return;
            }

            input.select();

            input.setSelectionRange(
                0,
                input.value.length
            );

            document.execCommand(
                "copy"
            );

            showMessage();
        }


        function showMessage() {

            const message =
                document.getElementById(
                    "copyMessage"
                );

            message.style.display = "block";

            setTimeout(function () {

                message.style.display = "none";

            }, 2500);
        }

    </script>

</body>

</html>
